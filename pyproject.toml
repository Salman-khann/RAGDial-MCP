[project]
name = "ragdial-mcp"
version = "0.1.0"
description = "RAGDial MCP: a RAG retrieval ablation & chunking lab. An MCP server that lets coding agents run controlled chunking/retrieval experiments and pick pipelines by hard metrics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.13",
    "pydantic>=2.7",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
# Real embedding models, cross-encoder reranker and ChromaDB vector store.
ml = [
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
]
# PDF -> Markdown parsing that preserves tables.
pdf = ["pymupdf4llm>=0.0.17"]
all = ["ragdial-mcp[ml,pdf]"]

[project.scripts]
ragdial-mcp = "ragdial_mcp.server:main"
ragdial-demo = "ragdial_mcp.demo:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdial_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
