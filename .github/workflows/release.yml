name: Release

# Publishing a GitHub release (tag "vX.Y.Z") builds the package, tests the built
# wheel, uploads it to PyPI with trusted publishing (no API token stored), then
# lists the new version in the official MCP Registry from server.json (GitHub OIDC).
#
# One-time setup on pypi.org: Publishing -> Add a new pending publisher
#   PyPI project name: ragdial-mcp
#   Owner: Salman-khann   Repository: RAGDial-MCP
#   Workflow: release.yml  Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build + verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(grep -Po '__version__ = "\K[^"]+' src/ragdial_mcp/__init__.py)
          tag="${GITHUB_REF_NAME#v}"
          echo "package=$version tag=$tag"
          test "$version" = "$tag"

      - name: Tests
        run: |
          uv sync --locked
          uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the built wheel in isolation
        run: |
          wheel=$(ls dist/*.whl)
          cd "$RUNNER_TEMP"
          uvx --from "$GITHUB_WORKSPACE/$wheel" ragdial-demo
          uvx --from "$GITHUB_WORKSPACE/$wheel" ragdial-mcp --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ragdial-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    name: publish to MCP Registry
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login for the io.github.Salman-khann/* namespace
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Wait until PyPI serves this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/ragdial-mcp/$version/json" >/dev/null; then echo "PyPI has $version"; exit 0; fi
            sleep 10
          done
          echo "PyPI never served $version" >&2; exit 1

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
